<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maintenance en cours</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0f172a;font-family:system-ui,-apple-system,sans-serif;color:#e2e8f0;padding:20px}
  .card{text-align:center;max-width:400px}
  .icon{font-size:48px;margin-bottom:20px}
  h1{font-size:22px;font-weight:700;color:#f1f5f9;margin-bottom:8px}
  p{font-size:14px;color:#94a3b8;line-height:1.6}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:#3b82f6;margin:20px 4px 0;animation:blink 1.2s infinite}
  .dot:nth-child(2){animation-delay:.2s}
  .dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
<script>setTimeout(()=>location.reload(),10000)</script>
</head>
<body>
<div class="card">
  <div class="icon">⚙️</div>
  <h1>Mise à jour en cours</h1>
  <p>Le serveur redémarre pour appliquer une mise à jour.<br>
     Cette page se rechargera automatiquement dans quelques secondes.</p>
  <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</div>
</body>
</html>
