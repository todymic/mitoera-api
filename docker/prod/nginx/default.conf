server {
    listen 80;
    server_name _;
    root /app/public;

    client_max_body_size 20m;

    # Re-résoudre les hostnames Docker dynamiquement (évite le 502 après recreate d'un container)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_backend         app:9000;
    set $app_sandbox_backend app-sandbox:9000;

    # Routage sandbox : clé pk_test_ (Basic) ou header X-Api-Mode: sandbox (JWT)
    # base64('pk_test_') = 'cGtfdGVzdF8'
    set $api_backend $app_backend;
    if ($http_x_api_mode = "sandbox") {
        set $api_backend $app_sandbox_backend;
    }
    if ($http_authorization ~* "^Basic\s+cGtfdGVzdF") {
        set $api_backend $app_sandbox_backend;
    }

    location /.well-known/mercure {
        proxy_pass http://mercure:3010/.well-known/mercure;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Sandbox render — sert render.html depuis app-sandbox (injecte /sandbox-api comme API_PREFIX)
    location ^~ /sandbox-render {
        rewrite ^/sandbox-render(.*)$ /render$1 break;
        fastcgi_pass $app_sandbox_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param REQUEST_URI $uri$is_args$args;
    }

    # Sandbox API — proxy vers l'instance app-sandbox (même image, DB séparée)
    # La rewrite transforme /sandbox-api/... en /api/... pour Symfony
    location ^~ /sandbox-api/ {
        rewrite ^/sandbox-api/(.*)$ /api/$1 break;
        fastcgi_pass $app_sandbox_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param REQUEST_URI $uri$is_args$args;
    }

    # Endpoint interne prod↔sandbox : accessible uniquement depuis le réseau Docker
    location ^~ /api/internal/ {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $api_backend;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Static assets (if any served directly, e.g. public/bundles)
    location ~ ^/(bundles|build)/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # Pendant un redémarrage du container app, PHP-FPM est brièvement indisponible.
    # Au lieu d'un 502 brut, on sert une page de maintenance avec reload auto.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
        add_header Retry-After 15;
        add_header Cache-Control "no-store";
    }

    error_log /dev/stderr;
    access_log /dev/stdout;
}
