opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Deploys rebuild the image, so the filesystem never changes under a running
; container — skip the timestamp check for a small perf win. Restart php-fpm
; (i.e. redeploy the container) to pick up new code.
opcache.validate_timestamps=0
