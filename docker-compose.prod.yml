## Production — à lancer après : docker compose -f docker-compose.traefik.yml up -d
## (ou équivalent prod avec traefik.prod.yml sur le serveur)
##
## docker compose -f docker-compose.prod.yml up -d --build
## Migrations : docker compose -f docker-compose.prod.yml exec app php bin/console doctrine:migrations:migrate --no-interaction

services:

  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    image: mitoera/app:latest
    container_name: mitoera-app
    restart: unless-stopped
    volumes:
      - ./var:/app/var
      - ./config/jwt:/app/config/jwt:ro
      # Partagé avec nginx pour servir les assets statiques
      - public_shared:/app/public_shared
      # Credentials Firebase (ne pas committer le fichier JSON)
    env_file:
      - .env.prod
    environment:
      # Surcharge : pointe sur le service Redis, pas 127.0.0.1
      REDIS_URL: redis://redis:6379
    expose:
      - "9000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mitoera-network

  cron:
    image: mitoera/app:latest
    container_name: mitoera-cron
    restart: unless-stopped
    command: >
      sh -c "while true; do
        php bin/console app:expire-holds --no-interaction;
        sleep 60;
      done"
    volumes:
      - ./var:/app/var
      - ./config/jwt:/app/config/jwt:ro
    env_file:
      - .env.prod
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mitoera-network

  worker:
    image: mitoera/app:latest
    container_name: mitoera-worker
    restart: unless-stopped
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M
    volumes:
      - ./var:/app/var
      - ./config/jwt:/app/config/jwt:ro
    env_file:
      - .env.prod
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mitoera-network

  nginx:
    image: nginx:alpine
    container_name: mitoera-nginx
    restart: unless-stopped
    volumes:
      # Assets statiques copiés par l'entrypoint de l'app
      - public_shared:/app/public:ro
      - ./docker/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mitoera-network
      - web
    labels:
      - "traefik.enable=true"
      # ─── Local (HTTP) ───────────────────────────────────────────────────
      - "traefik.http.routers.mitoera-local.rule=Host(`mitoera.localhost`)"
      - "traefik.http.routers.mitoera-local.entrypoints=web"
      # ─── Prod (HTTPS) ───────────────────────────────────────────────────
      - "traefik.http.routers.mitoera.rule=Host(`api.mitoera.com`)"
      - "traefik.http.routers.mitoera.entrypoints=websecure"
      - "traefik.http.routers.mitoera.tls=true"
      - "traefik.http.routers.mitoera.tls.certresolver=letsencrypt"
      # ─── Service (port nginx interne) ───────────────────────────────────
      - "traefik.http.services.mitoera.loadbalancer.server.port=80"

  ui:
    build:
      context: /home/debian/mitoera/ui
      dockerfile: Dockerfile
    image: mitoera/ui:latest
    container_name: mitoera-ui
    restart: unless-stopped
    networks:
      - mitoera-network
      - web
    labels:
      - "traefik.enable=true"
      # ─── Prod (HTTPS) ───────────────────────────────────────────────────
      - "traefik.http.routers.mitoera-ui.rule=Host(`mitoera.com`)"
      - "traefik.http.routers.mitoera-ui.entrypoints=websecure"
      - "traefik.http.routers.mitoera-ui.tls=true"
      - "traefik.http.routers.mitoera-ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.mitoera-ui.loadbalancer.server.port=80"

  admin:
    build:
      context: /home/debian/mitoera/admin
      dockerfile: Dockerfile
    image: mitoera/admin:latest
    container_name: mitoera-admin
    restart: unless-stopped
    networks:
      - mitoera-network
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mitoera-admin.rule=Host(`admin.mitoera.com`)"
      - "traefik.http.routers.mitoera-admin.entrypoints=websecure"
      - "traefik.http.routers.mitoera-admin.tls=true"
      - "traefik.http.routers.mitoera-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.mitoera-admin.loadbalancer.server.port=80"

  # ─── Sandbox ────────────────────────────────────────────────────────────────

  app-sandbox:
    image: mitoera/app:latest
    container_name: mitoera-app-sandbox
    restart: unless-stopped
    volumes:
      - ./var-sandbox:/app/var
      - ./config/jwt:/app/config/jwt:ro
    env_file:
      - .env.sandbox
    environment:
      APP_ENV: prod
      APP_SANDBOX: "true"
      REDIS_URL: redis://redis:6379
    expose:
      - "9000"
    depends_on:
      database-sandbox:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mitoera-network

  cron-sandbox:
    image: mitoera/app:latest
    container_name: mitoera-cron-sandbox
    restart: unless-stopped
    command: >
      sh -c "while true; do
        php bin/console app:expire-holds --no-interaction;
        sleep 60;
      done"
    volumes:
      - ./var-sandbox:/app/var
      - ./config/jwt:/app/config/jwt:ro
    env_file:
      - .env.sandbox
    environment:
      APP_ENV: prod
      APP_SANDBOX: "true"
      REDIS_URL: redis://redis:6379
    depends_on:
      database-sandbox:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mitoera-network

  database-sandbox:
    image: postgres:16-alpine
    container_name: mitoera-database-sandbox
    restart: unless-stopped
    env_file:
      - .env.sandbox
    environment:
      POSTGRES_DB: mitoera_sandbox
      POSTGRES_USER: tody
    volumes:
      - database_sandbox_data:/var/lib/postgresql/data:rw
    networks:
      - mitoera-network
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "mitoera_sandbox", "-U", "tody"]
      timeout: 5s
      retries: 5
      start_period: 60s

  # ─── Production DB ──────────────────────────────────────────────────────────

  database:
    image: postgres:16-alpine
    container_name: mitoera-database
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    networks:
      - mitoera-network
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-mitoera}", "-U", "${POSTGRES_USER:-tody}"]
      timeout: 5s
      retries: 5
      start_period: 60s

  mercure:
    image: dunglas/mercure
    container_name: mitoera-mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':3010'
      MERCURE_PUBLISHER_JWT_KEY: '${MERCURE_JWT_SECRET}'
      MERCURE_SUBSCRIBER_JWT_KEY: '${MERCURE_JWT_SECRET}'
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins https://mitoera.com https://api.mitoera.com https://admin.mitoera.com
        subscriptions
        ui
    networks:
      - mitoera-network

  redis:
    image: redis:7-alpine
    container_name: mitoera-redis
    restart: unless-stopped
    networks:
      - mitoera-network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  database_data:
  database_sandbox_data:
  redis_data:
  public_shared:

networks:
  mitoera-network:
    driver: bridge
  web:
    external: true
