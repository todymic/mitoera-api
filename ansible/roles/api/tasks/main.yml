---
- name: Cloner / mettre à jour le repo API
  git:
    repo: "{{ api_repo }}"
    dest: "{{ api_path }}"
    version: main
    accept_hostkey: true
    force: true
  become: false

- name: Supprimer les images Docker orphelines pour libérer de l'espace
  shell: docker image prune -f
  become: true
  ignore_errors: true

- name: Nettoyer le build cache Docker (évite les SHA orphelins)
  shell: docker buildx prune -f --keep-storage=500mb
  become: true
  ignore_errors: true

- name: Vider le cache Symfony prod avant rebuild (évite les décalages de DI container)
  file:
    path: "{{ api_path }}/var/cache/prod"
    state: absent
  become: true
  ignore_errors: true

- name: Vider le cache Symfony sandbox avant rebuild
  file:
    path: "{{ api_path }}/var-sandbox/cache/prod"
    state: absent
  become: true
  ignore_errors: true

- name: Créer le dossier var avec les bonnes permissions (uid 82 = www-data Alpine)
  file:
    path: "{{ api_path }}/var/{{ item }}"
    state: directory
    owner: "82"
    group: "82"
    mode: "0755"
  become: true
  loop:
    - cache
    - log
    - sessions

- name: Lancer Traefik (prod)
  community.docker.docker_compose_v2:
    project_src: "{{ api_path }}"
    files:
      - docker-compose.traefik.prod.yml
    state: present
    pull: always
    remove_orphans: true
  become: true

- name: Copier .env.sandbox sur le serveur
  copy:
    src: "{{ playbook_dir }}/../.env.sandbox.secret"
    dest: "{{ api_path }}/.env.sandbox"
    mode: "0600"
  become: false
  ignore_errors: true

- name: Créer le dossier var-sandbox
  file:
    path: "{{ api_path }}/var-sandbox/{{ item }}"
    state: directory
    owner: "82"
    group: "82"
    mode: "0755"
  become: true
  loop:
    - cache
    - log
    - sessions

# Étape 1 — S'assurer que l'infra stable est up (nginx, db, redis, mercure).
# Ces containers n'ont pas d'image à rebuilder : recreate: auto les laisse en place
# s'ils tournent déjà → pas de coupure pendant le build de l'app.
- name: Démarrer les services infra stables (nginx, db, redis, mercure)
  community.docker.docker_compose_v2:
    project_src: "{{ api_path }}"
    files:
      - docker-compose.prod.yml
    services:
      - nginx
      - database
      - database-sandbox
      - redis
      - mercure
    state: present
    pull: missing
    recreate: auto
  become: true

# Étape 2a — Builder la nouvelle image SANS toucher les containers en cours.
# Les anciens containers continuent de servir les requêtes pendant tout le build.
- name: Builder l'image app (sans arrêter les containers)
  shell: |
    cd {{ api_path }}
    docker compose -f docker-compose.prod.yml build app app-sandbox
  become: true

# Étape 2b — Blue-green zero-downtime pour app et app-sandbox.
# Séquence : démarrer le container blue (nouvelle image) → attendre healthy
# → swap DNS Docker (rename) → nginx route vers new via cache DNS 10s
# → stopper l'ancien. Aucune coupure visible côté client.
- name: Copier le script blue-green sur le serveur
  copy:
    dest: /tmp/blue-green.sh
    mode: "0755"
    content: |
      #!/bin/bash
      set -e
      OLD=$1
      BLUE=$2
      ENV_FILE=$3
      VAR_MOUNT=$4
      APP_SANDBOX_FLAG=$5
      API_PATH={{ api_path }}

      # Nettoyer un éventuel container blue orphelin
      docker stop $BLUE >/dev/null 2>/dev/null || true
      docker rm   $BLUE >/dev/null 2>/dev/null || true

      EXTRA_ENV=""
      if [ "$APP_SANDBOX_FLAG" = "true" ]; then
        EXTRA_ENV="-e APP_SANDBOX=true"
      fi

      docker run -d --name $BLUE \
        --network api_mitoera-network \
        --restart unless-stopped \
        -v ${VAR_MOUNT}:/app/var \
        -v ${API_PATH}/config/jwt:/app/config/jwt:ro \
        --env-file ${ENV_FILE} \
        -e APP_ENV=prod \
        -e REDIS_URL=redis://redis:6379 \
        ${EXTRA_ENV} \
        mitoera/app:latest

      echo "Attente $BLUE healthy..."
      for i in $(seq 1 30); do
        docker exec $BLUE pgrep php-fpm >/dev/null 2>/dev/null && ALIVE=1 || ALIVE=0
        [ "$ALIVE" = "1" ] && break
        sleep 3
      done
      if [ "$ALIVE" != "1" ]; then
        echo "ERREUR: $BLUE pas healthy - rollback"
        docker stop $BLUE || true
        docker rm   $BLUE || true
        exit 1
      fi

      if docker inspect $OLD >/dev/null 2>/dev/null; then
        docker rename $OLD ${OLD}-old
        docker rename $BLUE $OLD
        sleep 15
        docker stop ${OLD}-old || true
        docker rm   ${OLD}-old || true
      else
        docker rename $BLUE $OLD
      fi
      echo "Blue-green $OLD OK"
  become: true

- name: Blue-green deploy app (prod) — zero downtime
  shell: >
    /tmp/blue-green.sh
    mitoera-app
    mitoera-app-blue
    {{ api_path }}/.env.prod
    {{ api_path }}/var
    false
  become: true

- name: Blue-green deploy app-sandbox — zero downtime
  shell: >
    /tmp/blue-green.sh
    mitoera-app-sandbox
    mitoera-app-sandbox-blue
    {{ api_path }}/.env.sandbox
    {{ api_path }}/var-sandbox
    true
  become: true

# Cron : pas de trafic direct, recreate simple
- name: Redémarrer cron et cron-sandbox
  community.docker.docker_compose_v2:
    project_src: "{{ api_path }}"
    files:
      - docker-compose.prod.yml
    services:
      - cron
      - cron-sandbox
    state: present
    pull: missing
    recreate: always
  become: true

- name: Attendre que la base de données soit prête
  community.docker.docker_container_info:
    name: mitoera-database
  register: db_info
  until: db_info.container.State.Health.Status == 'healthy'
  retries: 15
  delay: 5
  become: true

- name: Attendre que la base sandbox soit prête
  community.docker.docker_container_info:
    name: mitoera-database-sandbox
  register: db_sandbox_info
  until: db_sandbox_info.container.State.Health.Status == 'healthy'
  retries: 15
  delay: 5
  become: true

- name: Attendre que app soit healthy (PHP-FPM prêt)
  community.docker.docker_container_info:
    name: mitoera-app
  register: app_info
  until: app_info.container.State.Health.Status == 'healthy'
  retries: 20
  delay: 5
  become: true

- name: Attendre que app-sandbox soit healthy
  community.docker.docker_container_info:
    name: mitoera-app-sandbox
  register: app_sandbox_info
  until: app_sandbox_info.container.State.Health.Status == 'healthy'
  retries: 20
  delay: 5
  become: true

- name: Exécuter les migrations Doctrine (prod)
  community.docker.docker_container_exec:
    container: mitoera-app
    command: php bin/console doctrine:migrations:migrate --no-interaction
  register: migrations
  become: true

- name: Résultat migrations prod
  debug:
    msg: "{{ migrations.stdout }}"

# cache:clear + cache:warmup sont déjà exécutés dans l'entrypoint du container,
# AVANT que PHP-FPM ne démarre. Les relancer ici viderait le cache pendant que
# PHP-FPM sert des requêtes → fenêtre d'échec systématique (ex: workspace switcher).

- name: Copier les fichiers statiques publics vers le volume Docker (servi par nginx)
  shell: "cp -r {{ api_path }}/public/. /var/lib/docker/volumes/api_public_shared/_data/"
  become: true

- name: Lire le mot de passe sandbox depuis .env.sandbox
  shell: "grep '^POSTGRES_PASSWORD=' {{ api_path }}/.env.sandbox | cut -d= -f2"
  register: sandbox_db_password
  become: false
  changed_when: false

- name: Synchroniser le mot de passe sandbox DB (idempotent — corrige les volumes pré-existants)
  shell: >
    docker exec mitoera-database-sandbox
    psql -U tody -d mitoera_sandbox
    -c "ALTER USER tody WITH PASSWORD '{{ sandbox_db_password.stdout }}';"
  become: true
  ignore_errors: true

- name: Exécuter les migrations Doctrine (sandbox)
  community.docker.docker_container_exec:
    container: mitoera-app-sandbox
    command: php bin/console doctrine:migrations:migrate --no-interaction
  register: migrations_sandbox
  become: true

- name: Résultat migrations sandbox
  debug:
    msg: "{{ migrations_sandbox.stdout }}"

# Idem pour sandbox — cache géré par l'entrypoint avant PHP-FPM.

- name: Démarrer tous les services restants (worker, bo, ui, admin, cron…)
  community.docker.docker_compose_v2:
    project_src: "{{ api_path }}"
    files:
      - docker-compose.prod.yml
    state: present
    pull: missing
    recreate: auto
  become: true
