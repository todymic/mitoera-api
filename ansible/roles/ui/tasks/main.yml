---
- name: Cloner / mettre à jour le repo UI
  git:
    repo: "{{ ui_repo }}"
    dest: "{{ ui_path }}"
    version: main
    accept_hostkey: true
    force: true
    update: true
  become: false

- name: S'assurer que le repo UI est sur le dernier commit distant
  shell: git -C "{{ ui_path }}" pull origin main
  become: false

- name: Supprimer les images Docker orphelines avant build UI
  shell: docker image prune -f
  become: true
  ignore_errors: true

- name: Builder l'image UI sans cache
  shell: docker compose -f {{ api_path }}/docker-compose.prod.yml build --no-cache ui
  become: true

- name: Démarrer l'UI
  community.docker.docker_compose_v2:
    project_src: "{{ api_path }}"
    files:
      - docker-compose.prod.yml
    services:
      - ui
    state: present
    recreate: always
  become: true
