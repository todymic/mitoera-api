---
# Déploiement du seul rôle `api` (utile quand rien n'a changé côté ui / bo / admin).
# Les rôles et group_vars sont résolus automatiquement depuis ce dossier,
# comme pour deploy.yml — aucune variable d'environnement nécessaire :
#
#   ansible-playbook -i ansible/inventory.ini ansible/deploy-api.yml
#
- name: Déploiement Mitoera API uniquement
  hosts: production
  gather_facts: false

  roles:
    - api
