## traefik.prod.yml — configuration statique production (HTTPS + Let's Encrypt)

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# Dashboard sécurisé (accès via label BasicAuth sur le service traefik)
api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    network: web
    exposedByDefault: false
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: gtody.rabekoto@gmail.com
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

accessLog: {}
