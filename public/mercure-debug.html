<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mercure Debug</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 14px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    header h1 { font-size: 15px; font-weight: 700; color: #f8fafc; letter-spacing: .5px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
    .badge-green { background: #14532d; color: #4ade80; }
    .badge-red { background: #450a0a; color: #f87171; }
    .controls { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
    input[type=text] { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 5px 10px; border-radius: 6px; font-size: 13px; width: 300px; }
    button { padding: 5px 14px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-sub { background: #3b82f6; color: #fff; }
    .btn-sub:hover { background: #2563eb; }
    .btn-clear { background: #334155; color: #cbd5e1; }
    .btn-clear:hover { background: #475569; }
    #log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
    .msg { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; font-size: 12px; line-height: 1.5; }
    .msg-time { color: #64748b; font-size: 11px; margin-bottom: 4px; }
    .msg-topic { color: #818cf8; font-weight: 600; margin-bottom: 4px; word-break: break-all; }
    .msg-data { color: #86efac; white-space: pre-wrap; word-break: break-all; }
    .msg-data.err { color: #f87171; }
    .empty { color: #475569; text-align: center; padding: 40px; font-size: 14px; }
    .subs-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px; border-bottom: 1px solid #1e293b; min-height: 36px; }
    .sub-tag { background: #1e3a5f; color: #7dd3fc; font-size: 11px; padding: 2px 10px; border-radius: 99px; display: flex; align-items: center; gap: 6px; }
    .sub-tag button { background: none; color: #7dd3fc; font-size: 13px; padding: 0; line-height: 1; }
    .sub-tag button:hover { color: #f87171; }
    .counter { color: #64748b; font-size: 11px; }
  </style>
</head>
<body>
<header>
  <h1>⚡ Mercure Debug</h1>
  <span id="status" class="badge badge-red">Déconnecté</span>
  <span id="counter" class="counter">0 messages</span>
  <div class="controls">
    <input id="topicInput" type="text" placeholder="Topic ex: event/019f7654.../seats" value="event/019f7654-16ec-73b7-b513-6f93961a7624/seats">
    <button class="btn-sub" onclick="subscribe()">+ Abonner</button>
    <button class="btn-clear" onclick="clearLog()">Vider</button>
  </div>
</header>
<div id="subs" class="subs-list"></div>
<div id="log"><div class="empty">Aucun message reçu. Ajoutez un topic ci-dessus.</div></div>

<script>
const HUB = 'http://127.0.0.1:3010/.well-known/mercure';
// JWT subscriber (scope: subscribe *)
const JWT = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJtZXJjdXJlIjp7InN1YnNjcmliZSI6WyIqIl19fQ.MEjECAIS2M2YqNf8-QdSSo3etcbaVr8vc0VNkA5PsDI';

let sources = {}; // topic → EventSource
let msgCount = 0;

function subscribe() {
  const topic = document.getElementById('topicInput').value.trim();
  if (!topic || sources[topic]) return;

  const url = `${HUB}?topic=${encodeURIComponent(topic)}&authorization=${JWT}`;
  const es = new EventSource(url);

  es.onopen = () => updateStatus();
  es.onerror = () => updateStatus();
  es.onmessage = (e) => addMessage(topic, e.data);

  sources[topic] = es;
  renderSubs();
  updateStatus();
}

function unsubscribe(topic) {
  if (sources[topic]) { sources[topic].close(); delete sources[topic]; }
  renderSubs();
  updateStatus();
}

function renderSubs() {
  const el = document.getElementById('subs');
  el.innerHTML = Object.keys(sources).map(t => `
    <span class="sub-tag">
      ${t}
      <button onclick="unsubscribe('${t.replace(/'/g,"\\'")}')">✕</button>
    </span>`).join('') || '<span style="color:#475569;font-size:12px;padding:4px 0">Aucun abonnement actif</span>';
}

function updateStatus() {
  const open = Object.values(sources).some(es => es.readyState === EventSource.OPEN);
  const el = document.getElementById('status');
  el.textContent = open ? 'Connecté' : 'Déconnecté';
  el.className = 'badge ' + (open ? 'badge-green' : 'badge-red');
}

function addMessage(topic, data) {
  msgCount++;
  document.getElementById('counter').textContent = `${msgCount} messages`;
  const log = document.getElementById('log');
  const empties = log.querySelectorAll('.empty');
  empties.forEach(e => e.remove());

  let pretty = data;
  let isErr = false;
  try { pretty = JSON.stringify(JSON.parse(data), null, 2); } catch(_) { isErr = true; }

  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = `
    <div class="msg-time">${new Date().toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit',second:'2-digit',fractionalSecondDigits:3})}</div>
    <div class="msg-topic">${escHtml(topic)}</div>
    <pre class="msg-data${isErr?' err':''}">${escHtml(pretty)}</pre>`;
  log.prepend(div);
}

function clearLog() {
  msgCount = 0;
  document.getElementById('counter').textContent = '0 messages';
  document.getElementById('log').innerHTML = '<div class="empty">Aucun message reçu. Ajoutez un topic ci-dessus.</div>';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Handle Enter key
document.getElementById('topicInput').addEventListener('keydown', e => { if (e.key === 'Enter') subscribe(); });
</script>
</body>
</html>
