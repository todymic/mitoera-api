<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mitoera</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    #wrapper { display: flex; flex-direction: column; height: 100%; position: relative; }
    /* #chart au-dessus du filigrane (z-index:101 > z-index:100).
       PlaceRender hardcode background:white en inline style → on passe outre avec !important
       pour que les zones vides du plan soient transparentes et laissent voir le filigrane. */
    #chart { flex: 1; min-height: 0; position: relative; z-index: 101; background: transparent !important; }
    #chart > div { background: transparent !important; }
    #chart div[style*="will-change"] { background: transparent !important; }
    #stats-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 48px;
      font-family: system-ui, sans-serif;
      transition: min-height 0.2s ease;
    }
    #stats-info {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      flex: 1;
    }
    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      animation: fadeIn 0.18s ease;
    }
    .stat-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #stats-empty {
      font-size: 13px;
      color: #d1d5db;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

    #chart {
      opacity: 0;
      transform: scale(0.92);
      transform-origin: center center;
    }
    #chart.chart-ready {
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 1;
      transform: scale(1);
    }

    #loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.2s ease;
    }
    #loader.loader-hidden { opacity: 0; }
    .loader-ring {
      width: 36px; height: 36px;
      border: 3px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #sandbox-watermark {
      display: none;
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }
    #sandbox-watermark svg {
      width: 100%; height: 100%;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="sandbox-watermark">
      <svg xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="wm" x="0" y="0" width="220" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
            <text x="10" y="60" font-family="system-ui,sans-serif" font-size="22" font-weight="700"
                  letter-spacing="4" fill="rgba(245,158,11,0.18)" text-anchor="start">TEST</text>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#wm)"/>
      </svg>
    </div>
    <div id="loader"><div class="loader-ring"></div></div>
    <div id="chart"></div>
    <div id="stats-bar">
      <div id="stats-info"><span id="stats-empty">Aucun siège sélectionné</span></div>
    </div>
  </div>

  <script src="/mitoera-render.js"></script>
  <script type="module">
  /* ─────────────────────────────────────────────────────────────────────── */

  (function () {
    const params     = new URLSearchParams(location.search);
    const key        = params.get('key');
    const eventId    = params.get('event');
    const withCheckout = params.get('checkout') === '1';
    const showLegend   = params.get('legend') !== '0';
    const showResume   = params.get('resume') === '1';
    const API_BASE   = location.origin;
    const API_PREFIX = (window.__MITOERA_API_PREFIX__ || '/api');
    const isSandbox  = API_PREFIX === '/sandbox-api' || (key && key.startsWith('pk_test_'));
    const sandboxHeaders = isSandbox ? { 'X-Api-Mode': 'sandbox' } : {};

    // Affiche le filigrane TEST si clé sandbox (pk_test_) ou API sandbox
    if (isSandbox) {
      document.getElementById('sandbox-watermark').style.display = 'block';
    }

    let renderer      = null;
    let sessionToken  = null;
    let holdToken     = null;
    let mitoerEventId = null;
    let categoryPrices = {};
    let mercureES     = null;

    // ── auto-refresh du session token expiré ────────────────────────────────

    async function refreshSession() {
      const res = await fetch(`${API_BASE}${API_PREFIX}/public/events/${mitoerEventId}/session`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...sandboxHeaders },
        body: JSON.stringify({ publicKeyId: key }),
      });
      if (!res.ok) throw new Error('Impossible de renouveler la session');
      const data = await res.json();
      sessionToken = data.sessionToken;
      holdToken    = data.holdToken;
      emit('sessionRefreshed', { sessionToken, holdToken });
    }

    async function fetchWidget(url, opts = {}) {
      opts.headers = { ...(opts.headers || {}), ...sandboxHeaders, Authorization: `Widget ${sessionToken}` };
      let res = await fetch(url, opts);
      if (res.status === 401) {
        await refreshSession();
        opts.headers.Authorization = `Widget ${sessionToken}`;
        res = await fetch(url, opts);
      }
      return res;
    }

    // ── postMessage helpers ──────────────────────────────────────────────────

    function emit(type, payload) {
      window.parent.postMessage({ type: 'mitoera:' + type, ...(payload || {}) }, '*');
    }

    window.addEventListener('message', (e) => {
      const { type, ...data } = e.data || {};
      if (type === 'mitoera:setCategoryPrices') {
        categoryPrices = data.prices || {};
        if (renderer) {
          for (const [catId, info] of Object.entries(categoryPrices)) {
            if (renderer._catMap[catId]) {
              renderer._catMap[catId].price    = info.price;
              renderer._catMap[catId].currency = info.currency;
            }
          }
          renderer._drawAll();
        }
      }
      if (type === 'mitoera:getSelectedSeats') {
        emit('selectedSeats', { seats: renderer ? renderer.getSelectedSeats() : [] });
      }
      if (type === 'mitoera:fullscreenChange' && renderer) {
        renderer.onFullscreenChange(data.inFs);
      }
      if (type === 'mitoera:selectSeats' && renderer && Array.isArray(data.seatKeys)) {
        renderer.selectSeats(data.seatKeys);
      }
    });

    // ── stats bar + checkout ─────────────────────────────────────────────────

    const statsInfo  = document.getElementById('stats-info');
    const statsEmpty = document.getElementById('stats-empty');

    function updateStatsBar() {
      if (!renderer) return;
      const seats = renderer.getSelectedSeats();

      const bycat = {};
      for (const s of seats) {
        const id = s.catId || '__none__';
        if (!bycat[id]) bycat[id] = { name: s.catName, color: s.catColor, count: 0 };
        bycat[id].count++;
      }

      const entries = Object.values(bycat);
      statsInfo.innerHTML = '';
      if (!entries.length) {
        statsInfo.appendChild(statsEmpty);
      } else {
        for (const { name, color, count } of entries) {
          const pill  = document.createElement('span'); pill.className = 'stat-pill';
          const dot   = document.createElement('span'); dot.className = 'stat-dot';
          dot.style.background = color;
          dot.style.boxShadow  = `0 0 0 2.5px ${color}40`;
          const label = document.createElement('span');
          label.textContent = `${name || 'Catégorie'} — ${count} siège${count > 1 ? 's' : ''}`;
          pill.appendChild(dot);
          pill.appendChild(label);
          statsInfo.appendChild(pill);
        }
      }
    }

    // ── init ─────────────────────────────────────────────────────────────────

    async function init() {

      try {
        // Session
        const sessionRes = await fetch(`${API_BASE}${API_PREFIX}/public/events/${eventId}/session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...sandboxHeaders },
          body: JSON.stringify({ publicKeyId: key }),
        });
        if (!sessionRes.ok) throw new Error('Clé publique invalide ou événement introuvable');
        const sessionData = await sessionRes.json();
        sessionToken   = sessionData.sessionToken;
        holdToken      = sessionData.holdToken;
        mitoerEventId  = sessionData.eventId || eventId;

        // Event data
        const eventRes = await fetchWidget(`${API_BASE}${API_PREFIX}/widget/events/${mitoerEventId}`);
        if (!eventRes.ok) throw new Error("Impossible de charger l'événement");
        const eventData = await eventRes.json();

        // Render
        document.getElementById('chart').innerHTML = '';
        renderer = new PlaceRender({
          container: document.getElementById('chart'),
          data: {
            chartObjects:   eventData.publishedSnapshot || [],
            categories:     eventData.categories     || [],
            seats:          eventData.seats           || [],
            categoryPrices: categoryPrices,
          },
          onSeatSelected:   (seat) => { emit('seatSelected',   { seat }); },
          onSeatDeselected: (seat) => { emit('seatDeselected', { seat }); },
          showLegend,
          showResume,
        });

        window.__renderer__ = renderer; // exposed for e2e tests
        renderer._onSelectionChange = () => {
          const seats = renderer.getSelectedSeats();
          emit('selectionChange', { seats });
          updateStatsBar();
        };
        renderer.render();
        requestAnimationFrame(() => {
          document.getElementById('chart').classList.add('chart-ready');
          setTimeout(() => document.getElementById('loader').classList.add('loader-hidden'), 80);
        });

        // Mercure — seat status updates + plan updates en temps réel
        if (mercureES) { mercureES.close(); mercureES = null; }
        const mercureHub = eventData.mercurePublicUrl || `${API_BASE}/.well-known/mercure`;

        // Fetch subscriber JWT
        let mercureToken = null;
        try {
          const chartSlugParam = eventData.chartSlug ? `&chartSlug=${encodeURIComponent(eventData.chartSlug)}` : '';
          const tokenRes = await fetchWidget(`${API_BASE}${API_PREFIX}/widget/mercure-token?eventId=${mitoerEventId}${chartSlugParam}`);
          if (tokenRes.ok) mercureToken = (await tokenRes.json()).token;
        } catch (_) {}

        const esUrl = new URL(mercureHub);
        esUrl.searchParams.append('topic', `event/${mitoerEventId}/seats`);
        if (eventData.chartSlug) esUrl.searchParams.append('topic', `chart/${eventData.chartSlug}`);
        if (mercureToken) esUrl.searchParams.append('authorization', mercureToken);
        mercureES = new EventSource(esUrl.toString());
        mercureES.onmessage = (e) => {
          const msg = JSON.parse(e.data);

          // Mise à jour du plan (publication depuis le BO)
          if (msg.type === 'chartUpdated') {
            fetchWidget(`${API_BASE}${API_PREFIX}/widget/events/${mitoerEventId}`)
            .then(r => r.ok ? r.json() : null).then(data => {
              if (!data || !renderer) return;
              renderer.reload({
                chartObjects: data.publishedSnapshot || [],
                categories:   data.categories || [],
                seats:        data.seats || [],
              });
              emit('planUpdated', {});
            }).catch(() => {});
            return;
          }

          // Mise à jour des statuts de sièges
          const changes = Array.isArray(msg) ? msg : null;
          if (!changes) return;
          emit('seatUpdate', { changes });
          if (renderer) {
            try {
              renderer.updateSeats(changes.map(c => ({ seatKey: c.seatKey, status: c.status })));
            } catch (_) {}
          }
        };

        emit('ready', { sessionToken, holdToken, eventId: mitoerEventId });

      } catch (err) {
        document.getElementById('chart').innerHTML =
          `<div style="padding:2rem;color:#ef4444;font-family:system-ui;font-size:14px">${err.message}</div>`;
        emit('error', { message: err.message });
      }
    }

    init();

    window.addEventListener('beforeunload', () => {
      if (mercureES) { mercureES.close(); mercureES = null; }
    });
  })();
  </script>
</body>
</html>
