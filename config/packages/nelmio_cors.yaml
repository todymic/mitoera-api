nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(string:CORS_ALLOW_ORIGINS)%']
        allow_credentials: true
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
        allow_headers: ['Authorization', 'Content-Type', 'Accept', 'Origin', 'X-Requested-With', 'X-Api-Mode']
        expose_headers: []
        max_age: 3600

    paths:
        # embed-token est appelé depuis le SDK navigateur (mitoera-editor.js) avec une clé secrète.
        # Pas de cookies → allow_credentials: false → allow_origin: '*' est légal.
        '^/api/auth/embed-token':
            allow_origin: ['*']
            allow_credentials: false
            allow_methods: ['POST', 'OPTIONS']
            allow_headers: ['Authorization', 'Content-Type', 'Accept', 'Origin', 'X-Requested-With', 'X-Api-Mode']
            expose_headers: []
            max_age: 3600

        '^/api/':
            origin_regex: true
            allow_origin: ['%env(string:CORS_ALLOW_ORIGINS)%']
            allow_credentials: true
            allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
            allow_headers: ['Authorization', 'Content-Type', 'Accept', 'Origin', 'X-Requested-With', 'X-Api-Mode']
            expose_headers: []
            max_age: 3600

