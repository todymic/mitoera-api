# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(APP_SANDBOX): 'false'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # SessionService configuration
    App\Service\SessionService:
        arguments:
            $jwtSecret: '%env(string:JWT_SECRET_KEY)%'
            $sessionDurationMinutes: '%env(int:SEATING_SESSION_DURATION_MINUTES)%'

    # --- Port / Adapters : SeatPublisherPort ---
    App\Port\SeatPublisherPort:
        alias: App\Adapter\Outbound\MercureSeatPublisher

    # EventService — Mercure public URL for widget subscribers
    App\Service\EventService:
        arguments:
            $mercurePublicUrl: '%env(default::MERCURE_PUBLIC_URL)%'

    # BookingService configuration
    App\Service\BookingService:
        arguments:
            $redisUrl: '%env(string:REDIS_URL)%'
            $holdDurationMinutes: '%env(int:SEATING_HOLD_DURATION_MINUTES)%'

    # HoldExpirationJob configuration
    App\Service\HoldExpirationJob:
        arguments:
            $redisUrl: '%env(string:REDIS_URL)%'

    # SeatStreamController — connexion Redis dédiée pour le pub/sub SSE
    App\Controller\SeatStreamController:
        arguments:
            $redisUrl: '%env(string:REDIS_URL)%'
        tags: ['controller.service_arguments']

    # AdminSeatStreamController — SSE admin (auth JWT backoffice)
    App\Controller\AdminSeatStreamController:
        arguments:
            $redisUrl: '%env(string:REDIS_URL)%'
        tags: ['controller.service_arguments']

    App\Controller\SandboxController:
        arguments:
            $appSandbox: '%env(string:APP_SANDBOX)%'
        tags: ['controller.service_arguments']

    App\Controller\RenderController:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $appSandbox: '%env(string:APP_SANDBOX)%'
        tags: ['controller.service_arguments']

    App\EventListener\JWTCreatedListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_created, method: onJWTCreated }

    App\Service\MercureTokenService:
        arguments:
            $mercureJwtSecret: '%env(string:MERCURE_JWT_SECRET)%'

    # StripeService
    App\Service\StripeService:
        arguments:
            $secretKey:       '%env(string:STRIPE_SECRET_KEY)%'
            $webhookSecret:   '%env(string:STRIPE_WEBHOOK_SECRET)%'
            $priceStarter:    '%env(string:STRIPE_PRICE_STARTER)%'
            $pricePro:        '%env(string:STRIPE_PRICE_PRO)%'
            $priceEnterprise: '%env(string:STRIPE_PRICE_ENTERPRISE)%'




